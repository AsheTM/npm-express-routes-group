version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels:
      - dependencies
    assignees:
      - AsheTM
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The express dev dependency tests Express 4; express5 covers Express 5.
      - dependency-name: express
        update-types: ["version-update:semver-major"]
